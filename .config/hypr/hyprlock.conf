source = ~/.config/hypr/hyprlock-colors.conf
# Colours above come from matugen and change with the wallpaper.
# Previous version: hyprlock.conf.bak

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    grace = 3
    ignore_empty_input = true
}

auth {
    fingerprint:enabled = true
    fingerprint:ready_message = Scan fingerprint or type password
    fingerprint:present_message = Scanning…
}

animations {
    enabled = true
    bezier = ease, 0.25, 1, 0.5, 1
    animation = fadeIn, 1, 4, ease
    animation = fadeOut, 1, 4, ease
    animation = inputFieldDots, 1, 2, ease
}

# ---------- Background: blurred screenshot of the desktop ----------
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.012
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.2
}

# ---------- Clock ----------
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 110
    font_family = JetBrainsMono NF ExtraBold
    color = $text
    shadow_passes = 2
    shadow_size = 6
    position = 0, 250
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 18
    font_family = $font
    color = $primary
    position = 0, 160
    halign = center
    valign = center
}

# ---------- Avatar + greeting ----------
image {
    monitor =
    path = ~/.face
    size = 120
    rounding = -1
    border_size = 3
    border_color = $primary
    position = 0, 30
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] ~/.local/bin/lock-info greeting
    font_size = 14
    font_family = $font
    color = $text
    position = 0, -55
    halign = center
    valign = center
}

# ---------- Password / fingerprint ----------
input-field {
    monitor =
    size = 320, 52
    rounding = 26
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    outer_color = $outline
    inner_color = $surface
    font_color = $text
    check_color = $primary
    fail_color = $error
    capslock_color = $error
    font_family = $font
    placeholder_text = <i>󰈷  $FPRINTPROMPT</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    fade_on_empty = false
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = $FPRINTFAIL
    font_size = 11
    font_family = $font
    color = $error
    position = 0, -170
    halign = center
    valign = center
}

# ---------- Bottom corners: media + battery ----------
label {
    monitor =
    text = cmd[update:2000] ~/.local/bin/lock-info media
    font_size = 12
    font_family = $font
    color = $text
    position = 30, 30
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:30000] ~/.local/bin/lock-info battery
    font_size = 12
    font_family = $font
    color = $text
    position = -30, 30
    halign = right
    valign = bottom
}

