# Generated by matugen - edit ~/.config/matugen/templates/cava.conf instead
[general]
framerate = 60
bar_width = 2
bar_spacing = 1
sensitivity = 100

[input]
method = pulse
source = auto

[output]
method = noncurses

[color]
background = default
gradient = 1
gradient_color_1 = '{{colors.tertiary.default.hex}}'
gradient_color_2 = '{{colors.secondary.default.hex}}'
gradient_color_3 = '{{colors.primary.default.hex}}'
gradient_color_4 = '{{colors.primary_fixed.default.hex}}'

[smoothing]
noise_reduction = 77
