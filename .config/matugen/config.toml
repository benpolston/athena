[config]
reload_apps = false

[templates.waybar]
input_path  = "~/.config/matugen/templates/colors.css"
output_path = "~/.config/waybar/tokens/colors.css"
post_hook   = "pkill -SIGUSR2 waybar"

[templates.wofi]
input_path  = "~/.config/matugen/templates/colors.css"
output_path = "~/.config/wofi/colors.css"


[templates.hyprlock]
input_path  = "~/.config/matugen/templates/hyprlock-colors.conf"
output_path = "~/.config/hypr/hyprlock-colors.conf"

[templates.hyprland]
input_path  = "~/.config/matugen/templates/hypr-colors.lua"
output_path = "~/.config/hypr/colors.lua"
post_hook   = "hyprctl reload"

[templates.kitty]
input_path  = "~/.config/matugen/templates/kitty-colors.conf"
output_path = "~/.config/kitty/colors.conf"
post_hook   = "pkill -SIGUSR1 kitty"

# Fixed terminal hues, nudged ("harmonized") toward the wallpaper's colour.
[config.custom_colors]
red     = "#e06c75"
green   = "#98c379"
yellow  = "#e5c07b"
blue    = "#61afef"
magenta = "#c678dd"
cyan    = "#56b6c2"

[templates.cava]
input_path  = "~/.config/matugen/templates/cava.conf"
output_path = "~/.config/cava/config"
post_hook   = "pkill -USR1 cava || true"

[templates.gtk3]
input_path  = "~/.config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-3.0/gtk.css"

[templates.gtk4]
input_path  = "~/.config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-4.0/gtk.css"

[templates.kde]
input_path  = "~/.config/matugen/templates/kde.colors"
output_path = "~/.local/share/color-schemes/Matugen.colors"
post_hook   = "~/.local/bin/apply-kde-colors"

[templates.swaync]
input_path  = "~/.config/matugen/templates/swaync-colors.css"
output_path = "~/.config/swaync/tokens/variables.css"
post_hook   = "swaync-client -rs >/dev/null 2>&1 || true"

[templates.sddm]
input_path  = "~/.config/matugen/templates/sddm.conf"
output_path = "/var/lib/hyprsddm/theme.conf.user"

[templates.sidra]
input_path  = "~/.config/matugen/templates/sidra.json"
output_path = "~/.config/Sidra/custom-theme.json"

[templates.nvim]
input_path  = "~/.config/matugen/templates/nvim-colors.lua"
output_path = "~/.config/nvim/lua/matugen-colors.lua"
post_hook   = "pkill -USR1 -x nvim || true"
